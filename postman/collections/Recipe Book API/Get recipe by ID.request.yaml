$kind: http-request
url: "{{base_url}}/recipes/{{recipe_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("title", () => pm.expect(pm.response.json().title).to.eql("Plov"));
    language: text/javascript
order: 7000
